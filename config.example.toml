# Copy to config.toml and edit. Gitignored, because it holds your API keys.
#
# Any setting can be overridden on the command line, except the keys, which
# an environment variable of the same name in capitals overrides instead.

[keys]
# Speech recognition. Create a key at https://console.deepgram.com
# New accounts include free credit that covers a long time at a few
# meetings a week.
deepgram_api_key = ""

# Translation. Any OpenAI-compatible endpoint, the part of the URL before
# /chat/completions. The model it serves is translation.model below.
#
#   Google            https://generativelanguage.googleapis.com/v1beta/openai
#   Claude            https://api.anthropic.com/v1
#   OpenAI            https://api.openai.com/v1
#   Local Ollama      http://localhost:11434/v1
#   LiteLLM proxy     http://your-proxy:4000/v1
llm_base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
llm_api_key = ""

# Both addresses carry a token, so a tunnel open to the internet serves the
# room rather than whoever finds it. Empty means one is minted per run and
# printed at startup, and last week's link stops working.
#
# Pin reader_token when the room reads from a printed card that has to keep
# working. Anyone with the card can read the meeting, which is the same
# bargain as a card in the foyer.
reader_token = ""

# Pins the /operator address across restarts, for development. Leave empty
# for a meeting, so a link that leaks expires when the server does.
operator_token = ""

# What a remote sender authenticates with, for the hosted deployment
# HOSTED.md describes, where the audio comes over a socket from a laptop in
# the room rather than from a sound card on this machine. Pinned rather
# than minted, because the sender is configured once and has to keep
# working; only read when [audio] backend is "remote".
control_token = ""

[audio]
# auto picks parec on Linux when available and sounddevice everywhere else.
# Force one with "sounddevice" or "parec" if the other misbehaves.
#
# "remote" is the hosted deployment instead: no sound card here, the audio
# arrives over the control socket from a sender in the room, and this
# server raises the control listener below in place of the operator one.
backend = "auto"

[recognition]
model = "nova-3"
# Milliseconds of silence that ends an utterance. Lower is snappier but
# clips people who pause mid-sentence.
endpointing = 400

[segmentation]
# Seconds a half-finished sentence waits before being translated anyway.
# Watch how often sentences close with reason "ceiling": a lot of them means
# people are talking over each other.
ceiling = 4.0
# Silence that separates one person's abandoned sentence from the next
# person's new one.
gap = 0.6

[translation]
model = "gemini-3.8-flash"
# Translation does not benefit from deliberation. On models that think by
# default this roughly halves latency.
reasoning_effort = "low"
# Use the glossary to fix recognition errors on the English channel too.
correct_english = true
# Raise if responses truncate; thinking tokens count against this.
max_tokens = 2000
# Seconds before a request is abandoned.
timeout = 15
# Seconds to wait for a translation before showing English instead.
hold = 8

[languages]
# What readers may choose from. A language costs nothing until somebody
# opens it. Keep the list stable so bookmarks and printed cards keep working.
available = [
    "French",
    "Spanish",
    "Swahili",
]
# Seconds a language keeps running after its last reader leaves, so a phone
# locking its screen does not restart it.
grace = 90
# Most languages to translate at once, 0 for no cap. Keeps one client
# opening every channel from making every sentence cost the whole list.
max_active = 0

[files]
glossary = "glossary.txt"
keyterms = "keyterms.txt"

[session]
# Stop by itself after this many minutes with nothing said, because
# recognition is billed by audio duration and silence is audio. A session
# left running after a meeting would stream an empty room for days.
# Set to 0 to disable.
idle_stop_minutes = 10

# Keep a transcript of each session, so the glossary, the key terms, and the
# prompt can be improved from what was actually said rather than from
# memory. Off by default, and a decision to make with whoever leads the
# meeting: what is kept is every English sentence, every translation, and
# how long each took. See record.py, which turns one into a document worth
# reading. Nothing is ever deleted automatically.
record = false
database = "sessions.db"

[server]
# Loopback only, which is the right default when a tunnel is in front:
# readers reach the tunnel's HTTPS address, and the operator uses
# http://127.0.0.1:8081/operator, which browsers treat as a secure context
# so no certificate is needed on this machine.
#
# Change to "0.0.0.0" to let phones on the same wifi connect directly.
# That works, but it is plain HTTP, so phone screens will go dark mid
# sentence because the wake lock needs a secure context.
host = "127.0.0.1"
port = 8080

# The operator controls listen separately, always on 127.0.0.1, so that
# pointing a tunnel at the port above cannot expose them. A headless
# machine wants an SSH forward rather than a wider bind here.
operator_port = 8081

# Where a remote sender connects, when backend is "remote". Unlike the
# operator port this one has to be reachable, since the sender is in
# another building; control_token and a refusal of any browser handshake
# are what guard it. The same number as operator_port because a server
# raises one listener or the other, never both.
control_port = 8081

# Seconds a session keeps running after its sender's socket drops, before
# the server gives up and stops it. The recognizer socket is held open
# meanwhile, so a wifi blip costs a gap in the transcript rather than the
# meeting.
control_grace = 30

# Most readers to serve at once, 0 for no cap. Every reader costs a queue,
# a socket, and a write on every published line, and the reader link can
# travel further than the room the link was handed out in. A cap of 100 is
# more phones than a room holds, and a reader past the cap gets a 503 that
# the phone's browser retries.
max_readers = 100

# The address readers actually use, which is your tunnel's hostname, not the
# address above. The operator page shows this as a QR code people can point a
# camera at. Leave empty before a tunnel is set up.
public_url = "https://chapel.your-tailnet.ts.net/"

# A name for this room, written into each recorded session so a transcript
# still says where it was said once several rooms' recordings are read
# together. Leave empty when this machine serves the only room.
room = ""
