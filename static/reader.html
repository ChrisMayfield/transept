<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transept subtitles</title>
<style>
  :root {
    --ink: #16181d;
    --paper: #fbfaf7;
    --quiet: #737a86;
    --rule: #e3e0d9;
    --live: #1f5f5b;
    --size: 1.4rem;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #edeae4; --paper: #14161a; --quiet: #8b929d;
            --rule: #2a2e35; --live: #5fb3aa; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: .75rem;
    padding: calc(.6rem + env(safe-area-inset-top)) 1rem .6rem;
    background: var(--paper); border-bottom: 1px solid var(--rule);
  }
  /* min-width because a flex item will not shrink below its content, and a
     select's content is its widest option: on a narrow phone "Haitian
     Creole" would otherwise push the size buttons off the screen. */
  select {
    font: inherit; font-size: .95rem; font-weight: 600; color: var(--ink);
    background: transparent; border: 0; padding: .2rem 0;
    flex: 1; min-width: 0;
  }
  /* The same pair the operator page uses for a live channel. Grey against
     teal was too close a call on a phone in a bright room. */
  .dot {
    width: .5rem; height: .5rem; border-radius: 50%;
    background: var(--rule); flex: none;
  }
  .dot.on { background: var(--live); }
  .sizes { display: flex; gap: .25rem; }
  .sizes button {
    font: inherit; font-size: .95rem; width: 2rem; height: 2rem;
    border: 1px solid var(--rule); border-radius: 3px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  button:focus-visible, select:focus-visible {
    outline: 3px solid var(--live); outline-offset: 2px;
  }

  main {
    flex: 1; overflow-y: auto;
    padding: 1.25rem 1rem calc(4rem + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
  }
  /* Older lines recede so the eye finds the current one without hunting. */
  p {
    margin: 0 0 1.1rem; max-width: 34rem;
    font-size: var(--size); line-height: 1.45;
    color: var(--quiet); transition: color .4s ease;
  }
  p:last-child { color: var(--ink); }
  p.revised { animation: settle .5s ease; }
  @keyframes settle { from { opacity: .45; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    p { transition: none; }
    p.revised { animation: none; }
  }

  .waiting {
    color: var(--quiet); font-size: 1rem; font-style: italic; max-width: 28rem;
  }
  .resume {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(1.25rem + env(safe-area-inset-bottom));
    padding: .6rem 1.1rem; border: 0; border-radius: 999px;
    background: var(--ink); color: var(--paper); font: inherit;
    font-size: .9rem; font-weight: 600; cursor: pointer; display: none;
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot" title="Connecting"></span>
  <select id="channel" aria-label="Language"></select>
  <!-- Reset last rather than between the two steppers: those get tapped
       repeatedly, and a mis-tap in the middle would throw away the size
       somebody had just spent four taps finding. -->
  <div class="sizes">
    <button id="smaller" title="Smaller text"
            aria-label="Smaller text">&minus;</button>
    <button id="bigger" title="Larger text"
            aria-label="Larger text">+</button>
    <button id="reset" title="Default text size"
            aria-label="Default text size">&#8634;</button>
  </div>
</header>

<main id="feed">
  <p class="waiting" id="waiting"></p>
</main>

<button class="resume" id="resume"></button>

<script>
// The two lines this page says in its own voice, in the languages a
// congregation is likely to list. Written out here rather than fetched,
// because a reader who does not read English should not have to wait on
// the translation model to be told that nobody has spoken yet, and these
// two sentences never change. A language with no entry falls back to
// English, so adding one to config.toml is not a change to this file.
const PHRASES = {
  "English": ["Subtitles will appear here as people speak.",
              "Jump to newest"],
  "Amharic": ["ሰዎች ሲናገሩ የትርጉም ጽሑፎች እዚህ ይታያሉ።",
              "ወደ አዲሱ ሂድ"],
  "Arabic": ["ستظهر الترجمة النصية هنا أثناء حديث الناس.",
             "الانتقال إلى الأحدث"],
  "Chinese": ["人们说话时，字幕会显示在这里。",
              "跳到最新"],
  "Farsi": ["هنگامی که افراد صحبت می‌کنند، زیرنویس‌ها اینجا نمایش داده می‌شوند.",
            "رفتن به جدیدترین"],
  "French": ["Les sous-titres apparaîtront ici au fur et à mesure que les gens parlent.",
             "Aller au plus récent"],
  "German": ["Untertitel erscheinen hier, während die Leute sprechen.",
             "Zu den neuesten springen"],
  "Haitian Creole": ["Soutit yo ap parèt isit la pandan moun ap pale.",
                     "Ale nan pi resan an"],
  "Hindi": ["लोग जैसे-जैसे बोलेंगे, उपशीर्षक यहाँ दिखाई देंगे।",
            "नवीनतम पर जाएँ"],
  "Italian": ["I sottotitoli appariranno qui man mano che le persone parlano.",
              "Vai al più recente"],
  "Japanese": ["人々が話すと、ここに字幕が表示されます。",
               "最新へ移動"],
  "Korean": ["사람들이 말하면 자막이 여기에 표시됩니다.",
             "최신으로 이동"],
  "Kurdish": ["Jêrnivîs dê li vir xuya bibin dema ku mirov diaxivin.",
              "Biçe ya herî nû"],
  "Nepali": ["मानिसहरू बोल्दै जाँदा उपशीर्षकहरू यहाँ देखिनेछन्।",
             "पछिल्लोमा जानुहोस्"],
  "Polish": ["Napisy pojawią się tutaj, gdy ludzie będą mówić.",
             "Przejdź do najnowszych"],
  "Portuguese": ["As legendas aparecerão aqui à medida que as pessoas falarem.",
                 "Ir para o mais recente"],
  "Russian": ["Субтитры будут появляться здесь по мере того, как люди говорят.",
              "К последним"],
  "Somali": ["Qoraallada halkan ayay ka soo muuqan doonaan marka dadku hadlaan.",
             "U bood kan ugu cusub"],
  "Spanish": ["Los subtítulos aparecerán aquí a medida que las personas hablen.",
              "Ir a lo más reciente"],
  "Swahili": ["Manukuu yataonekana hapa watu wanapozungumza.",
              "Nenda kwenye mapya zaidi"],
  "Tagalog": ["Lalabas dito ang mga subtitle habang nagsasalita ang mga tao.",
              "Pumunta sa pinakabago"],
  "Ukrainian": ["Субтитри з’являтимуться тут, коли люди говоритимуть.",
                "Перейти до найновішого"],
  "Vietnamese": ["Phụ đề sẽ xuất hiện ở đây khi mọi người nói.",
                 "Đến phần mới nhất"],
};

// Right to left, so the two lines this page writes itself read correctly.
// Subtitle text carries dir="auto" instead, since a mixed line is common.
const RTL = ["Arabic", "Farsi", "Kurdish"];

const feed = document.getElementById("feed");
const dot = document.getElementById("dot");
const picker = document.getElementById("channel");
const resume = document.getElementById("resume");

// One id per page load, not per channel: it tells the server that the
// stream it is about to open replaces the one this phone already had, so
// the language being left stops without waiting out the grace period.
// Unguessable, and it names nobody.
const reader = (crypto.randomUUID ? crypto.randomUUID()
  : String(Math.random()).slice(2) + String(Date.now()));

// The dot is the only thing on this page that says whether subtitles are
// still arriving, and a pause in the room looks exactly like a dropped
// connection. The title is what tells the two apart, so it moves with the
// colour rather than standing at one word for both states.
function connected(live) {
  dot.classList.toggle("on", live);
  dot.title = live ? "Connected" : "Not connected, trying again";
}

let source = null;
let seen = new Map();
let pinned = true;

// The same number as --size in the stylesheet, which is what the page shows
// for the moment before this script runs. A stored size outside the range
// the buttons can reach is not a size this page wrote, so it is ignored
// rather than applied: --size: NaNrem would leave the subtitles unreadable
// with no way to tap back out of it.
const DEFAULT_SIZE = 1.4;
const MIN_SIZE = 0.9;
const MAX_SIZE = 3;
const stored = parseFloat(localStorage.getItem("subtitleSize"));
let size = (stored >= MIN_SIZE && stored <= MAX_SIZE) ? stored : DEFAULT_SIZE;

function applySize() {
  document.documentElement.style.setProperty("--size", size + "rem");
  localStorage.setItem("subtitleSize", String(size));
}
document.getElementById("bigger").onclick = () => {
  size = Math.min(size + 0.15, MAX_SIZE); applySize();
};
document.getElementById("smaller").onclick = () => {
  size = Math.max(size - 0.15, MIN_SIZE); applySize();
};
document.getElementById("reset").onclick = () => {
  size = DEFAULT_SIZE; applySize();
};
applySize();

feed.addEventListener("scroll", () => {
  const atBottom =
    feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
  pinned = atBottom;
  resume.style.display = atBottom ? "none" : "block";
});
resume.onclick = () => {
  pinned = true;
  resume.style.display = "none";
  feed.scrollTop = feed.scrollHeight;
};

// Put this page's own two lines into the language being read. An unlisted
// language keeps the English wording rather than showing nothing.
function speak(channel) {
  const [waiting, newest] = PHRASES[channel] || PHRASES["English"];
  const rtl = RTL.includes(channel);
  const placeholder = document.getElementById("waiting");
  if (placeholder) {
    placeholder.textContent = waiting;
    placeholder.dir = rtl ? "rtl" : "ltr";
  }
  resume.textContent = newest;
  resume.dir = rtl ? "rtl" : "ltr";
}

function addLine(entry) {
  const waiting = document.getElementById("waiting");
  if (waiting) waiting.remove();

  // A line can arrive twice: once as transcribed, once corrected against
  // the glossary. Same seq means replace the words, not add a line.
  let line = seen.get(entry.seq);
  if (line) {
    if (line.textContent !== entry.text) {
      line.textContent = entry.text;
      line.classList.add("revised");
    }
    return;
  }

  line = document.createElement("p");
  // The subtitle may be a right to left language, and an English name or a
  // scripture reference inside it stays left to right either way.
  line.dir = "auto";
  line.textContent = entry.text;
  feed.appendChild(line);
  seen.set(entry.seq, line);
  while (feed.children.length > 120) {
    const oldest = feed.firstChild;
    for (const [key, node] of seen) {
      if (node === oldest) { seen.delete(key); break; }
    }
    feed.removeChild(oldest);
  }
  if (pinned) feed.scrollTop = feed.scrollHeight;
}

function connect(channel) {
  if (source) source.close();
  seen = new Map();
  feed.innerHTML = '<p class="waiting" id="waiting"></p>';
  speak(channel);
  localStorage.setItem("subtitleChannel", channel);
  // The reader id tells the server this stream replaces the one this phone
  // already had, so a language somebody has just left stops being paid for
  // rather than running out its grace period with nobody reading it.
  source = new EventSource("/stream/" + encodeURIComponent(channel)
                           + "?reader=" + encodeURIComponent(reader));
  source.onopen = () => connected(true);
  source.onerror = () => connected(false);
  source.onmessage = (event) => {
    connected(true);
    addLine(JSON.parse(event.data));
  };
}

picker.onchange = () => connect(picker.value);

// Before the channel list arrives, so a returning reader is not shown a
// blank line and then an English one a moment later.
speak(localStorage.getItem("subtitleChannel") || "English");

// Keep the screen awake; reacquire after the phone is unlocked.
async function keepAwake() {
  if (!("wakeLock" in navigator)) return;
  try { await navigator.wakeLock.request("screen"); } catch (error) { }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});
keepAwake();

fetch("/api/channels").then((r) => r.json()).then(({ channels }) => {
  // Alphabetical, English included: the server lists English first because
  // that is the order the pipeline works in, but a reader looking for
  // Swahili scans a list, and a name out of order is a name they scan past.
  // English is still what an untouched phone opens on.
  const sorted = channels.slice().sort((a, b) => a.localeCompare(b));
  for (const name of sorted) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    picker.appendChild(option);
  }
  const saved = localStorage.getItem("subtitleChannel");
  picker.value = channels.includes(saved) ? saved : "English";
  connect(picker.value);
});
</script>
</body>
</html>
