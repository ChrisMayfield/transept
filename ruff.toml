# Linting for a project with no build step and no CI.
# Run it with `ruff check .`, or let `python3 tests/selftest.py` run it for you.

line-length = 79
target-version = "py311"

[lint]
# E, W   pycodestyle: the layout rules this code already follows
# F      pyflakes: unused names, undefined names, shadowed imports
# UP     pyupgrade: syntax left over from older Python
# B      bugbear: mutable defaults, loop variable capture, bare except
# C4     comprehensions: the slower or wordier way to build a dict or list
#
# I (import sorting) is deliberately absent. Ruff can only emit one import
# per line, and the hanging indent style used here is just as sorted and
# a good deal shorter.
select = ["E", "W", "F", "UP", "B", "C4"]

[lint.per-file-ignores]
# The suite lives in tests/ and the code it imports in src/, and nothing is
# installed, so its imports of the project have to follow the line putting
# src/ on the path. Moving them up would make every one of them fail.
"tests/selftest.py" = ["E402"]
